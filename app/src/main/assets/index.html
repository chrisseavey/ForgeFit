<style>

lter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.nav button{background:none;color:var(--muted);padding:12px 18px 15px;min-width:82px;font-size:12px;font-weight:800}.nav button.active{color:var(--accent)}.nav b{display:block;font-size:18px;margin-bottom:2px}.exercise{border:1px solid var(--line);border-radius:15px;padding:13px;margin:10px 0;background:#111519}.exercise h3{margin:0;font-size:17px}.exercise-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}.exercise-header h3{font-size:21px;line-height:1.22;letter-spacing:-.3px;margin:0 0 6px}.exercise-header .exercise-heading{min-width:0;flex:1}.exercise-remove{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid #45505b;border-radius:50%;background:transparent;color:#b9c3cb;font-size:23px;line-height:1;cursor:pointer}.exercise-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:5px 0 2px}.exercise-meta .pill{font-size:11px}.exercise-header .tag{line-height:1.4}

.home-cta{background:#b8ff4d;color:#0b0d0f;font-weight:900;font-size:16px;border-radius:12px;padding:15px;width:100%}.exercise.finished-ex{border-color:#38532b;background:#121b14}.exercise.finished-ex .exercise-header{margin-bottom:0}.exercise-finished-badge{color:#b8ff4d;font-size:12px;font-weight:800}.exercise-collapse{background:#243325;color:#b8ff4d;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:800}.rest-ring{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(#b8ff4d var(--rest-progress,0%),#29312b 0);padding:6px}.rest-ring-inner{background:#111519;border-radius:50%;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}.rest-adjust{background:#252b30;color:white;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:800}.celebrate{position:fixed;inset:0;z-index:120;background:#0b0d0ff5;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}.celebrate-card{width:100%;max-width:440px;text-align:center;background:linear-gradient(160deg,#263b20,#15191d);border:1px solid #506d3e;border-radius:24px;padding:28px 22px;animation:forgeCelebrate .6s ease-out}.celebrate-check{font-size:60px;color:#b8ff4d;text-shadow:0 0 22px #b8ff4d77}@keyframes forgeCelebrate{from{opacity:0;transform:scale(.91) translateY(18px)}to{opacity:1;transform:scale(1) translateY(0)}}.strength-chart{width:100%;height:175px;display:block}.streak-stat{color:#b8ff4d;font-size:13px;font-weight:800}.day-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 18px}.day-picker .btn{padding:14px 4px;font-size:13px;min-height:52px}@media(max-width:380px){.day-picker .btn{font-size:12px}} .nutrition-hero{background:radial-gradient(circle at 80% 10%,#304a25,#17211a 50%,#111619);border:1px solid #3d5a31;border-radius:24px;padding:20px;margin:12px 0}.nutrition-ring{width:184px;height:184px;border-radius:50%;padding:13px;background:conic-gradient(#b8ff4d var(--percent,0%),#303a32 0);margin:18px auto;box-shadow:0 0 35px #b8ff4d18}.nutrition-ring-center{width:100%;height:100%;border-radius:50%;background:#151d17;display:flex;flex-direction:column;align-items:center;justify-content:center}.nutrition-ring-center strong{font-size:36px}.nutrition-macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nutrition-macro{background:#11191a;border:1px solid #29362d;border-radius:14px;padding:12px 8px;text-align:center}.nutrition-macro strong{font-size:21px}.nutrition-track{height:6px;background:#2b3531;border-radius:12px;overflow:hidden;margin-top:10px}.nutrition-track i{display:block;height:100%;border-radius:12px}.nutrition-meal{background:#141a1b;border:1px solid #2c3730;border-radius:17px;padding:16px;margin:12px 0}.nutrition-food{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #2a332e}.nutrition-input{background:#0d1313;color:white;border:1px solid #38463a;border-radius:11px;padding:12px;width:100%;min-width:0}.nutrition-form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.nutrition-nav{display:flex;align-items:center;justify-content:space-between}.nutrition-nav button{background:#273627;color:#b8ff4d;border-radius:10px;padding:9px 13px}.nutrition-tile{background:#151c19;border:1px solid #304234;border-radius:15px;padding:14px}.nutrition-accent{color:#b8ff4d}.nutrition-muted{color:#9ba8a0;font-size:12px}.nav button{min-width:0;flex:1;padding:12px 3px 15px;font-size:10px}@media(max-width:380px){.nutrition-ring{width:160px;height:160px}}.nav{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));min-height:calc(66px + env(safe-area-inset-bottom,0px))}.app{padding-bottom:calc(116px + env(safe-area-inset-bottom,0px))}.nav button{padding-top:10px;padding-bottom:10px;min-height:55px}.brand{position:relative;animation:forgeImpact .95s cubic-bezier(.12,.85,.18,1.1) both,forgeAftershock .4s ease-out .95s both;transform-origin:center;isolation:isolate}.brand:before{content:"";position:absolute;inset:-14px -24px;z-index:-1;pointer-events:none;background:radial-gradient(ellipse,#b8ff4d66 0%,#b8ff4d18 38%,transparent 70%);animation:forgeFlash 1.2s ease-out both}.brand:after{content:"";position:absolute;left:-12%;right:-12%;top:45%;height:3px;background:linear-gradient(90deg,transparent,#e8ffc9,#b8ff4d,transparent);box-shadow:0 0 19px #b8ff4d;transform:scaleX(0);animation:forgeSlash .65s ease-out .25s both}.brand span{animation:forgeGreen .95s ease-out .35s both}@keyframes forgeImpact{0%{opacity:0;filter:blur(9px);transform:translateY(-45px) scale(1.8) skewX(-13deg);letter-spacing:7px}48%{opacity:1;filter:blur(0);transform:translateY(5px) scale(.91) skewX(4deg);letter-spacing:-2px}65%{transform:translateY(-4px) scale(1.08) skewX(-2deg)}82%{transform:translateY(2px) scale(.98)}100%{opacity:1;transform:none;letter-spacing:-1.6px}}@keyframes forgeAftershock{0%,40%{text-shadow:0 0 0 transparent}60%{text-shadow:0 0 20px #b8ff4d99,0 0 45px #b8ff4d44}100%{text-shadow:0 0 0 transparent}}@keyframes forgeFlash{0%{opacity:0;transform:scale(.5)}45%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(1.8)}}@keyframes forgeSlash{0%{opacity:0;transform:scaleX(0)}45%{opacity:1;transform:scaleX(1.2)}100%{opacity:0;transform:scaleX(1.4)}}@keyframes forgeGreen{0%{color:#f5f7f8;filter:brightness(2)}65%{color:#dfffaa;filter:brightness(2)}100%{color:#b8ff4d;filter:brightness(1)}}@media(prefers-reduced-motion:reduce){.brand,.brand span,.brand:before,.brand:after{animation:none}}.nutrition-hero.goal-hit{border:1px solid #b8ff4d;box-shadow:0 0 18px #b8ff4d44,inset 0 0 18px #b8ff4d16;animation:goalGlow 2.2s ease-in-out infinite}.nutrition-hero.goal-hit .nutrition-track i{background:linear-gradient(90deg,#6fc62a,#cfff69,#f1ffae)!important;box-shadow:0 0 16px #b8ff4d,0 0 28px #b8ff4d88}.nutrition-hero.goal-hit .nutrition-ring{filter:drop-shadow(0 0 13px #b8ff4d99)}.nutrition-goal-win{text-align:center;color:#b8ff4d;font-weight:900;letter-spacing:.5px;margin:12px 0 0;animation:goalPop .7s ease-out both}@keyframes goalGlow{0%,100%{box-shadow:0 0 12px #b8ff4d33,inset 0 0 12px #b8ff4d11}50%{box-shadow:0 0 25px #b8ff4d88,inset 0 0 22px #b8ff4d22}}@keyframes goalPop{0%{opacity:0;transform:scale(.8)}75%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){.nutrition-hero.goal-hit,.nutrition-goal-win{animation:none}}.nutrition-macro.macro-goal-hit{border-radius:12px;box-shadow:0 0 17px #b8ff4d55,inset 0 0 10px #b8ff4d22;animation:goalGlow 2.2s ease-in-out infinite}.nutrition-macro.macro-goal-hit .nutrition-track i{box-shadow:0 0 12px #b8ff4d}.macro-win{font-size:10px;color:#b8ff4d;font-weight:900;letter-spacing:.3px;margin-top:7px}@media(prefers-reduced-motion:reduce){.nutrition-macro.macro-goal-hit{animation:none}}.screen.swipe-from-right{animation:forgeSlideFromRight .29s cubic-bezier(.2,.75,.2,1) both}.screen.swipe-from-left{animation:forgeSlideFromLeft .29s cubic-bezier(.2,.75,.2,1) both}@keyframes forgeSlideFromRight{from{opacity:.65;transform:translateX(45px)}to{opacity:1;transform:translateX(0)}}@keyframes forgeSlideFromLeft{from{opacity:.65;transform:translateX(-45px)}to{opacity:1;transform:translateX(0)}}@media(prefers-reduced-motion:reduce){.screen.swipe-from-right,.screen.swipe-from-left{animation:none}}</style></head><body><div class="app"><header class="top"><div class="brand">FORGE<span>FIT</span></div><button class="btn small settings-btn" aria-label="Settings" onclick="show('more')">⚙</button></header><button id="update-banner" class="btn primary hidden" style="margin:0 14px 12px;width:calc(100% - 28px)" onclick="openForgeFitUpdate()"></button><main id="main" class="screen"></main><nav class="nav"><button id="n-home" onclick="show(&apos;home&apos;)"><b>⌂</b>HOME</button><button id="n-train" onclick="show('train')"><b>▶</b>TRAIN</button><button id="n-plan" onclick="show('plan')"><b>☷</b>PLAN</button><button id="n-progress" onclick="show('progress')"><b>↗</b>PROGRESS</button><button id="n-nutrition" onclick="show('nutrition')"><b>◉</b>FOOD</button><button id="n-more" onclick="show('more')"><b>•••</b>MORE</button></nav></div>
<script>
const defaultPlan=[
{name:'Chest Day',focus:'Chest • Shoulders • Triceps',ex:[['Barbell Bench Press','Chest',3,6,10,120],['Incline Bench Press','Chest',3,8,12,90],['Shoulder Press','Shoulders',3,8,12,90],['Cable / Pec Deck Fly','Chest',3,10,15,60],['Lateral Raise','Shoulders',3,12,15,60],['Triceps Pressdown','Triceps',3,10,15,60]]},
{name:'Back Day',focus:'Back • Biceps • Traps',ex:[['Barbell Bent-Over Row','Back',3,6,10,120],['Lat Pulldown','Back',3,8,12,90],['Seated Cable Row','Back',3,8,12,90],['Dumbbell Curl','Biceps',3,10,15,60],['Hammer Curl','Biceps',3,10,15,60],['Shrugs','Traps',3,10,15,75]]},
{name:'Leg Day',focus:'Quads • Hamstrings • Glutes • Calves',ex:[['Squat','Quads / Glutes',3,6,10,150],['Leg Press','Quads / Glutes',3,8,12,120],['Romanian Deadlift','Hamstrings / Glutes',3,8,12,120],['Leg Extension','Quads',3,10,15,75],['Leg Curl','Hamstrings',3,10,15,75],['Calf Raise','Calves',3,10,15,60]]}
];
let state=JSON.parse(localStorage.getItem('forgefit')||'null')||{plan:defaultPlan,history:[],current:null,week:1};
function save(){localStorage.setItem('forgefit',JSON.stringify(state))}
function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;')}
function lastFor(name){for(let i=state.history.length-1;i>=0;i--){let e=state.history[i].exercises.find(x=>x.name===name&&(x.sets||[]).some(s=>s.done));if(e)return e}return null}
function previousCompletedSets(name){let last=lastFor(name);return last?(last.sets||[]).filter(s=>s.done):[]}
function recommend(e){let previous=previousCompletedSets(e[0]);let base=previous[0];return {w:base?.weight??e[5]??0,r:base?.reps??e[3],why:base?'Last completed workout':'First workout'}}
function show(page){forgeCurrentPage=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('n-'+page)?.classList.add('active');let m=document.getElementById('main');if(page==='home')renderHome(m);if(page==='train')renderTrain(m);if(page==='plan')renderPlan(m);if(page==='progress')renderProgress(m);if(page==='more')renderMore(m);if(page==='nutrition')renderNutrition(m)}
function homeKey(v){let d=new Date(v);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function homeProgress(){return !!(state.current&&Object.values(state.current.sets||{}).some(a=>Array.isArray(a)&&a.some(x=>x.done)))}
function homeChoose(i){if(homeProgress()&&state.current.day!==i){forgeDialog('Switch Workout?','Your unfinished sets will be cleared.',()=>{state.current={day:i,sets:{}};save();renderHome(document.getElementById('main'))},'Switch Day',true);return}state.current={day:i,sets:{}};save();renderHome(document.getElementById('main'))}
function homeHistory(key){let rows=state.history.filter(h=>homeKey(h.date)===key);if(rows.length)forgeDialog('Completed Workouts',rows.map(h=>h.day+' • '+h.exercises.length+' exercises').join('\n'),null,'Close')}
function renderHome(m){
 let now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay());
 let days=Array.from({length:7},(_,i)=>new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));
 let done=new Set(state.history.map(h=>homeKey(h.date))),week=new Set(days.map(homeKey));
 let weekly=state.history.filter(h=>week.has(homeKey(h.date))).length;
 let monthly=state.history.filter(h=>{let d=new Date(h.date);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()}).length;
 let idx=state.current?.day??(state.history.length%state.plan.length),day=state.plan[idx],resume=homeProgress();
 let calendar=days.map((d,i)=>{let key=homeKey(d),finished=done.has(key);return '<div style="text-align:center"><div class="muted">'+['S','M','T','W','T','F','S'][i]+'</div><button '+(finished?'onclick="homeHistory('+String.fromCharCode(39)+key+String.fromCharCode(39)+')"':'disabled')+' style="border-radius:50%;width:37px;height:37px;margin:9px auto;background:'+(finished?'#b8ff4d':'#252b30')+';color:'+(finished?'#0b0d0f':'white')+';font-weight:800;'+(key===homeKey(now)?'outline:2px solid #b8ff4d;outline-offset:2px':'')+'">'+(finished?'✓':d.getDate())+'</button></div>'}).join('');
 let choices=state.plan.map((p,i)=>'<button class="btn '+(i===idx?'primary':'')+'" onclick="homeChoose('+i+')" style="font-size:12px;padding:11px 4px">'+esc(p.name)+'</button>').join('');
 m.innerHTML='<div class="eyebrow">'+now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase()+'</div><h1 style="font-size:30px;line-height:1.15;margin:8px 0">Ready to get stronger?</h1><p class="muted">Your next workout is waiting.</p>'+
 '<div class="card"><div class="row"><b>Your week</b><span class="tag">'+weekly+' completed</span></div><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:16px">'+calendar+'</div><p class="muted" style="font-size:12px">Tap a checkmark to view your workout.</p></div>'+
 '<div class="card" style="background:linear-gradient(145deg,#25351e,#151a18);border-color:#405b32;padding:21px"><div class="row"><span class="tag">'+(resume?'IN PROGRESS':'UP NEXT')+'</span><span class="pill">DAY '+(idx+1)+' OF 3</span></div><h2 style="font-size:29px;margin:10px 0">'+esc(day.name)+'</h2><div class="muted">'+esc(day.focus)+'</div><p>'+day.ex.length+' exercises</p><button onclick="show(&apos;train&apos;)" style="width:100%;background:#b8ff4d;color:#0b0d0f;font-size:17px;font-weight:900;padding:17px;border-radius:13px;margin-top:12px">▶ '+(resume?'RESUME ':'START ')+esc(day.name.toUpperCase())+'</button></div>'+
 '<h3>Choose your workout</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'+choices+'</div><h3>Recent personal records 🏆</h3><div class="card">'+(latestRecords().length?latestRecords().map(r=>'<div class="row" style="padding:6px 0"><span>'+safeText(r.name)+'</span><b>'+r.weight+' lb</b></div>').join(''):'<p class="muted">Your first record will appear after a completed workout.</p>')+'</div><button class="btn" style="width:100%;margin:10px 0" onclick="showMonthCalendar()">VIEW MONTHLY CALENDAR ▦</button><h3>Muscle recovery estimate</h3><div class="card">'+muscleRecovery().map(r=>'<div class="row" style="padding:8px 0"><b>'+r.name+'</b><span style="color:'+r.color+'">'+r.label+'</span></div>').join('')+'<p class="muted" style="font-size:12px">Estimated from workout dates, not a measurement of actual muscle recovery.</p></div>'+'<h3>Your progress</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="card"><div class="tag">THIS WEEK</div><h2>'+weekly+'</h2><span class="muted">Workouts</span></div><div class="card"><div class="tag">THIS MONTH</div><h2>'+monthly+'</h2><span class="muted">Workouts</span></div></div>';
}
function chooseDay(idx){if(!Number.isInteger(idx)||idx<0||idx>=state.plan.length)return;if(state.current?.day!==idx){if(state.current&&Object.values(state.current.sets).some(a=>Array.isArray(a)&&a.some(x=>x.done))){forgeDialog('Switch Workout Day?','Your unfinished sets will be cleared.',()=>{state.current={day:idx,sets:{}};save();show('train')},'Switch Day',true);return}state.current={day:idx,sets:{}};save()}show('train')}
const planetFitnessSwaps={
'Chest':["Pectoral Fly (Butterfly) Machine","Machine Bench Press","Plate-Loaded Supine Bench Press",'Smith Machine Bench Press','Seated Chest Press Machine','Plate-Loaded Supine Chest Press','Incline Chest Press Machine','Smith Machine Incline Bench Press','Dumbbell Bench Press','Dumbbell Incline Press','Pec Deck Fly','Cable Chest Fly'],
'Shoulders':["Shoulder Press Machine","Lateral Raise Machine",'Seated Shoulder Press Machine','Smith Machine Shoulder Press','Dumbbell Shoulder Press','Cable Lateral Raise','Dumbbell Lateral Raise','Reverse Pec Deck'],
'Triceps':["Tricep Extension Machine",'Cable Triceps Pushdown','Rope Triceps Pushdown','Overhead Cable Triceps Extension','Assisted Dip Machine'],
'Back':["Lat Pulldown",'Lat Pulldown Machine','Close-Grip Lat Pulldown','Seated Cable Row','Seated Row Machine','Chest-Supported Row Machine','Smith Machine Bent-Over Row','One-Arm Dumbbell Row','Assisted Pull-Up Machine'],
'Biceps':["Bicep Curl Station","Fixed Barbell Bicep Curl",'Dumbbell Curl','Hammer Curl','Preacher Curl Machine','Cable Biceps Curl'],
'Traps':['Dumbbell Shrugs','Smith Machine Shrugs','Cable Shrugs'],
'Quads / Glutes':["Seated Leg Press","Hip Adduction Machine","Hip Abduction Machine",'Leg Press Machine','Hack Squat Machine','Smith Machine Squat','Goblet Squat','Leg Extension Machine','Dumbbell Lunges'],
'Quads':['Leg Extension Machine','Leg Press Machine','Hack Squat Machine','Smith Machine Squat'],
'Hamstrings / Glutes':['Seated Leg Curl Machine','Lying Leg Curl Machine','Smith Machine Romanian Deadlift','Dumbbell Romanian Deadlift'],
'Hamstrings':["Lying / Seated Leg Curl Machine",'Seated Leg Curl Machine','Lying Leg Curl Machine','Dumbbell Romanian Deadlift'],
'Abs':['Abdominal Crunch Machine'],
'Calves':['Calf Raise Machine','Leg Press Calf Raise','Smith Machine Calf Raise']
};
function forgeDialog(title,message,action,label='Confirm',danger=false){
 const old=document.getElementById('forge-dialog');if(old)old.remove();

 class="muted" style="margin-top:5px">${h.exercises.reduce((n,e)=>n+(e.sets||[]).filter(s=>s.done).length,0)} completed sets${h.exercises.filter(e=>e.cardio).map(e=>' • Treadmill '+(e.cardio.minutes||0)+' min'+(e.cardio.distance?' / '+e.cardio.distance+' mi':'')).join('')}${typeof h.durationSeconds==="number"?" • "+durationLabel(h.durationSeconds):""}</div></div>`).join('')||'<span class="muted">Your completed workouts will appear here.</span>'}</div></div><div class="card"><b>What ForgeFit is watching</b><p class="muted">Every completed workout is saved by date. New workouts begin with the same set weights and reps you used the last time you performed each exercise.</p></div>`}
let restEnd=0,restExercise=null,restInterval=null,exerciseTimerInt=null,restDuration=60;
function exerciseClock(ei){state.current.exerciseTimers??={};return state.current.exerciseTimers[ei]??={elapsed:0,startedAt:null,finished:false}}
function elapsedSeconds(ei){let t=exerciseClock(ei);return Math.floor((t.elapsed||0)+(t.startedAt?(Date.now()-t.startedAt)/1000:0))}
function startExerciseClock(ei){let t=exerciseClock(ei);if(!t.startedAt){t.startedAt=Date.now();t.finished=false}save();updateExerciseClocks();if(!exerciseTimerInt)exerciseTimerInt=setInterval(updateExerciseClocks,1000)}
function stopExerciseClock(ei){let t=exerciseClock(ei);if(t.startedAt){t.elapsed+=(Date.now()-t.startedAt)/1000;t.startedAt=null}t.finished=true;save();updateExerciseClocks()}
function updateExerciseClocks(){if(!state.current)return;let exercises=workoutExercises();for(let ei=0;ei<exercises.length;ei++){let t=exerciseClock(ei),d=document.getElementById('exercise-timer-'+ei),l=document.getElementById('timer-label-'+ei),btn=document.getElementById('exercise-btn-'+ei);if(d)d.textContent=fmt(elapsedSeconds(ei));if(l)l.textContent=t.finished?'EXERCISE COMPLETE':t.startedAt?'EXERCISE RUNNING':'EXERCISE TIMER';if(btn){btn.textContent=t.finished?'COMPLETED':t.startedAt?'TIMER RUNNING':'START EXERCISE';btn.disabled=!!t.startedAt||!!t.finished;btn.classList.toggle('primary',!t.startedAt&&!t.finished)}}}
function toggleExerciseTimer(ei){startExerciseClock(ei)}
function refreshSetRest(){if(restExercise===null)return;let remaining=Math.max(0,Math.ceil((restEnd-Date.now())/1000));let d=document.getElementById('rest-timer-'+restExercise),l=document.getElementById('rest-label-'+restExercise);if(d)d.textContent=fmt(remaining);let ring=document.getElementById('rest-ring-'+restExercise);if(ring)ring.style.setProperty('--rest-progress',Math.max(0,Math.min(100,100*remaining/Math.max(1,restDuration)))+'%');if(l)l.textContent=remaining?'REST AFTER SET • '+fmt(restForExercise(restExercise)):'REST COMPLETE';if(!remaining){clearInterval(restInterval);restInterval=null}}const exerciseRestSeconds={"Barbell Bench Press": 150, "Incline Bench Press": 120, "Machine Shoulder Press": 90, "Shoulder Press": 90, "Cable Fly": 60, "Pec Deck Fly": 60, "Cable Lateral Raise": 60, "Lateral Raise": 60, "Triceps Pressdown": 60, "Barbell Bent-Over Row": 150, "Bent-Over Barbell Row": 150, "Lat Pulldown": 90, "Seated Cable Row": 90, "Dumbbell Curl": 60, "Hammer Curl": 60, "Shrugs": 60, "Squat": 150, "Leg Press": 150, "Romanian Deadlift": 120, "Leg Extension": 60, "Leg Curl": 60, "Calf Raise": 60};function restForExercise(ei){let name=currentExercise(ei)[0];return exerciseRestSeconds[name]??60};function adjustSetRest(ei,seconds){if(restExercise!==ei||Date.now()>=restEnd)return;restEnd=Math.max(Date.now(),restEnd+seconds*1000);restDuration=Math.max(1,restDuration+seconds);refreshSetRest()};function startSetRest(ei){clearInterval(restInterval);restExercise=ei;restDuration=restForExercise(ei);restEnd=Date.now()+restDuration*1000;refreshSetRest();restInterval=setInterval(()=>{let before=Date.now()<restEnd;refreshSetRest();if(before&&Date.now()>=restEnd)navigator.vibrate?.([300,100,300])},250)}function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
const FORGEFIT_VERSION='5.11';
let availableUpdate=null,updateChecked=false;
function compareVersions(a,b){let aa=String(a).replace(/^v/i,'').split('.').map(Number),bb=String(b).replace(/^v/i,'').split('.').map(Number);for(let i=0;i<Math.max(aa.length,bb.length);i++){if((aa[i]||0)!==(bb[i]||0))return (aa[i]||0)-(bb[i]||0)}return 0}
async function checkForgeFitUpdate(manual=false){
  let status=document.getElementById('update-status');
  if(status)status.textContent='Checking GitHub for updates…';
  try{
    let response=await fetch('https://api.github.com/repos/chrisseavey/ForgeFit/releases/latest',{cache:'no-store'});
    if(!response.ok)throw Error('GitHub is unavailable');
    let release=await response.json();
    availableUpdate=compareVersions(release.tag_name,FORGEFIT_VERSION)>0?release:null;
    updateChecked=true;
    let banner=document.getElementById('update-banner');
    if(banner){banner.classList.toggle('hidden',!availableUpdate);if(availableUpdate)banner.textContent='ForgeFit '+release.tag_name+' is ready to install. Tap to update.'}
    if(status)status.textContent=availableUpdate?'New version available: '+release.tag_name:'You are up to date (V'+FORGEFIT_VERSION+').';
    if(manual&&!availableUpdate)forgeDialog('Up to Date','ForgeFit V'+FORGEFIT_VERSION+' is up to date.',null,'OK');
  }catch(err){if(status)status.textContent='Unable to check updates. Workouts still work offline.';if(manual)forgeDialog('Update Check Failed','Check your internet connection and try again.',null,'OK')}
}
function openForgeFitUpdate(){if(availableUpdate?.tag_name && window.ForgeFitUpdates?.downloadUpdate){forgeDialog('Install Update?','Download ForgeFit '+availableUpdate.tag_name+'? Your workout history will be kept.',()=>window.ForgeFitUpdates.downloadUpdate(availableUpdate.tag_name),'Download')}else if(window.ForgeFitUpdates?.openRelease)window.ForgeFitUpdates.openRelease();else window.location.href='https://github.com/chrisseavey/ForgeFit/releases/latest'}

function foodMacro(name,value,goal,color){let ratio=value/Math.max(1,goal),hit=ratio>=.95&&ratio<=1.05,pct=Math.round(ratio*100);return '<div class="nutrition-macro '+(hit?'macro-goal-hit':'')+'"><div class="nutrition-muted">'+name+'</div><strong style="color:'+(hit?'#b8ff4d':color)+'">'+Math.round(value)+'g</strong><div class="nutrition-muted">of '+goal+'g · '+pct+'%</div><div class="nutrition-track"><i style="width:'+Math.min(100,100*ratio)+'%;background:'+(hit?'#b8ff4d':color)+'"></i></div>'+(hit?'<div class="macro-win">⚡ GOAL HIT!</div>':'')+'</div>'}

function foodWeightChart(){let ws=foodData().weights.slice().sort((a,b)=>a.date.localeCompare(b.date));if(!ws.length)return '<p class="nutrition-muted">Log your starting weight to begin your progress chart.</p>';let last=ws.slice(-30),lo=Math.min(...last.map(x=>x.weight))-2,hi=Math.max(...last.map(x=>x.weight))+2,w=320,h=135;let pts=last.map((x,i)=>({x:16+i*(w-32)/Math.max(1,last.length-1),y:12+(hi-x.weight)*(h-28)/(hi-lo)}));let line=pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');return '<svg viewBox="0 0 320 135" style="width:100%;height:145px" role="img" aria-label="Weight history line chart"><line x1="0" y1="112" x2="320" y2="112" stroke="#394238"/><polyline points="'+line+'" fill="none" stroke="#b8ff4d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+pts.map(p=>'<circle cx="'+p.x+'" cy="'+p.y+'" r="3.5" fill="#b8ff4d"/>').join('')+'</svg><div class="row"><span class="nutrition-muted">'+last[0].date+'</span><b>'+last[last.length-1].weight+' lb</b><span class="nutrition-muted">'+last[last.length-1].date+'</span></div>'}
function foodInsights(){let d=foodData(),days=[];for(let i=6;i>=0;i--){let date=new Date();date.setDate(date.getDate()-i);let key=date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');days.push({key,cal:d.entries.filter(e=>e.date===key).reduce((a,e)=>a+(Number(e.calories)||0),0)})}let max=Math.max(d.goals.calories,...days.map(x=>x.cal));return '<div class="card"><h3>Weight progress</h3>'+foodWeightChart()+'</div><div class="card"><h3>Weekly calorie trend</h3><div style="display:flex;align-items:flex-end;gap:8px;height:175px">'+days.map(x=>'<div style="flex:1;text-align:center"><div class="nutrition-muted">'+Math.round(x.cal)+'</div><div style="height:'+Math.max(3,120*x.cal/max)+'px;background:linear-gradient(#b8ff4d,#538d48);border-radius:8px 8px 2px 2px"></div><div class="nutrition-muted">'+new Date(x.key+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'})+'</div></div>').join('')+'</div></div><div class="card"><h3>Training + Nutrition</h3><p class="nutrition-muted">Workouts in last 7 days: '+state.history.filter(h=>Date.now()-new Date(h.date).getTime()<7*86400000).length+'</p><p class="nutrition-muted">Days with food logged: '+days.filter(x=>x.cal>0).length+' / 7</p></div>'}
function renderNutrition(m){let d=foodData(),t=foodTotals(),g=d.goals,left=Math.round(g.calories-t.calories),pct=Math.max(0,Math.min(100,100*t.calories/Math.max(1,g.calories))),water=d.water[foodDay]||0,date=new Date(foodDay+'T12:00:00'),goalRatio=t.calories/Math.max(1,g.calories),goalHit=goalRatio>=.95&&goalRatio<=1.05;m.innerHTML='<div class="eyebrow">FORGEFIT ULTIMATE • NUTRITION</div><div class="title">Fuel your progress.</div><div class="nutrition-nav"><button onclick="foodShift(-1)">‹</button><b>'+date.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'</b><button onclick="foodShift(1)">›</button></div><div class="nutrition-hero"><div class="eyebrow" style="text-align:center">DAILY CALORIES</div><div class="nutrition-ring" style="--percent:'+pct+'%"><div class="nutrition-ring-center"><strong>'+Math.abs(left).toLocaleString()+'</strong><span class="nutrition-muted">'+(left>=0?'remaining':'over goal')+'</span><small>'+Math.round(t.calories)+' / '+g.calories+' cal</small></div></div><div class="nutrition-macros">'+foodMacro('PROTEIN',t.protein,g.protein,'#b8ff4d')+foodMacro('CARBS',t.carbs,g.carbs,'#70baff')+foodMacro('FAT',t.fat,g.fat,'#ffa967')+'</div><div style="margin-top:16px"><div class="row"><span class="nutrition-muted">DAILY CALORIE PROGRESS</span><b>'+Math.round(pct)+'%</b></div><div class="nutrition-track" style="height:13px;margin-top:7px"><i style="width:'+pct+'%;background:#b8ff4d"></i></div>'+(goalHit?'<div class="nutrition-goal-win">⚡ DAILY GOAL CRUSHED! ⚡</div>':'')+'</div></div><div class="row" style="gap:5px;margin:16px 0">'+[['diary','DIARY'],['add','+ FOOD'],['insights','INSIGHTS'],['goals','GOALS']].map(([key,label])=>'<button class="btn '+(foodMode===key?'primary':'')+'" style="flex:1;padding:11px 3px;font-size:11px" onclick="foodView(&quot;'+key+'&quot;)">'+label+'</button>').join('')+'</div>'+(foodMode==='add'?foodAddForm():foodMode==='goals'?foodSettings():foodMode==='insights'?foodInsights():foodDiary()+'<div c function renderMore(m){m.innerHTML=`<div class="eyebrow">SETTINGS</div><div class="title">More</div><div class="card"><b>App updates • V${FORGEFIT_VERSION}</b><p class="muted" id="update-status">Check GitHub for a newer ForgeFit version.</p><button class="btn primary" onclick="checkForgeFitUpdate(true)">CHECK FOR UPDATES</button> <button class="btn" onclick="openForgeFitUpdate()">DOWNLOAD LATEST UPDATE</button></div><div class="card"><b>ForgeFit</b><p class="muted">Offline-first workouts. No account. Your workout history stays on this phone.</p><button class="btn" onclick="exportData()">EXPORT BACKUP</button> <button class="btn" onclick="requestRestore()">RESTORE BACKUP</button><input id="restore-file" type="file" accept=".json,application/json" style="display:none" onchange="restoreData(this)"><p class="muted" style="font-size:12px">Save your backup somewhere safe. Restoring replaces current data on this phone.</p></div><div class="card"><button class="btn danger" onclick="forgeDialog('Delete All Data?','This permanently removes your workout history and settings.',()=>{localStorage.removeItem('forgefit');location.reload()},'Delete All',true)">RESET ALL DATA</button></div>`}

function safeText(value){return esc(String(value??'')).replaceAll('"','&quot;').replaceAll("'","&#39;")}
function weightSuggestion(name,target){let previous=previousCompletedSets(name);if(!previous.length||previous.length<3)return null;let goal=Number(target)||10;if(!previous.every(x=>Number(x.reps)>=goal))return null;let w=Number(previous[0].weight)||0;if(w<=0||!previous.every(x=>Number(x.weight)===w))return null;return {weight:w+5,from:w}}

function monthCalendar(offset=0){let now=new Date(),first=new Date(now.getFullYear(),now.getMonth()+offset,1),year=first.getFullYear(),month=first.getMonth(),last=new Date(year,month+1,0).getDate(),done=new Set(state.history.map(h=>homeKey(h.date)));let buttons='';for(let i=0;i<first.getDay();i++)buttons+='<div></div>';for(let n=1;n<=last;n++){let d=new Date(year,month,n),k=homeKey(d),yes=done.has(k);buttons+='<button '+(yes?'onclick="homeHistory(\''+k+'\')"':'disabled')+' style="height:42px;border-radius:10px;background:'+(yes?'#b8ff4d':'#242b2f')+';color:'+(yes?'#10140e':'#c8d0d4')+';font-weight:800">'+(yes?'✓':n)+'</button>'}return '<div class="row"><button class="btn" onclick="changeCalendar(-1)">‹</button><b>'+first.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</b><button class="btn" onclick="changeCalendar(1)">›</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;margin-top:15px">'+['S','M','T','W','T','F','S'].map(d=>'<span class="muted">'+d+'</span>').join('')+buttons+'</div>'}

function showMonthCalendar(){calendarOffset=0;let el=document.createElement('div');el.className='celebrate';el.id='month-overlay';el.innerHTML='<div class="celebrate-card" style="text-align:left"><div class="row"><h2>Workout Calendar</h2><button class="btn" id="month-close">✕</button></div><div id="month-calendar"></div></div>';document.body.appendChild(el);el.querySelector('#month-calendar').innerHTML=monthCalendar(0);el.querySelector('#month-close').onclick=()=>el.remove()}
function muscleRecovery(){let groups=['Chest','Back','Legs'],labels=['Chest Day','Back Day','Leg Day'];return groups.map((g,i)=>{let last=[...state.history].reverse().find(h=>h.day===labels[i]);if(!last)return {name:g,label:'No recent workout',color:'#9ba5ac'};let elapsed=(Date.now()-new Date(last.date).getTime())/3600000;if(elapsed<0||!Number.isFinite(elapsed))return {name:g,label:'Unknown',color:'#9ba5ac'};return {name:g,label:elapsed<48?'Recovering · '+Math.floor(elapsed)+'h ago':'Ready · '+Math.floor(elapsed/24)+'d since training',color:elapsed<48?'#f0c86b':'#b8ff4d'}})}
function exportData(){if(window.ForgeFitBackup?.exportBackup){window.ForgeFitBackup.exportBackup(JSON.stringify({format:'ForgeFit Backup',version:1,exportedAt:new Date().toISOString(),data:state}));return}let blob=new Blob([JSON.stringify({format:'ForgeFit Backup',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),a=document.createElement('a');let url=URL.createObjectURL(blob);a.href=url;a.download='forgefit-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function requestRestore(){if(window.ForgeFitBackup?.importBackup){window.ForgeFitBackup.importBackup();return}document.getElementById('restore-file').click()}
function receiveForgeBackup(text){try{validateAndRestore(JSON.parse(text))}catch(err){forgeDialog('Import Failed',err.message||'Invalid backup file.',null,'OK')}}
function validateAndRestore(payload){let data=payload.format==='ForgeFit Backup'?payload.data:payload;if(!data||!Array.isArray(data.history)||!Array.isArray(data.plan)||data.plan.length!==3||!data.plan.every(p=>typeof p.name==='string'&&Array.isArray(p.ex))||!data.history.every(h=>h&&typeof h.date==='string'&&Array.isArray(h.exercises)))throw Error('This is not a valid ForgeFit backup.');forgeDialog('Restore Backup?','This will replace the current workout history and settings with the selected backup. Export your current data first if you want to keep it.',()=>{localStorage.setItem('forgefit',JSON.stringify(data));location.reload()},'Restore Backup',true)}
function restoreData(input){let file=input.files?.[0];if(!file)return;let reader=new FileReader();reader.onerror=()=>forgeDialog('Import Failed','Could not read the selected backup.',null,'OK');reader.onload=()=>{try{validateAndRestore(JSON.parse(reader.result))}catch(err){forgeDialog('Import Failed',err.message||'Invalid backup file.',null,'OK')}finally{input.value=''}};reader.readAsText(file)}


function forgeAnimateSwipe(direction){let m=document.getElementById('main');m.classList.remove('swipe-from-right','swipe-from-left');void m.offsetWidth;m.classList.add(direction);m.addEventListener('animationend',()=>m.classList.remove(direction),{once:true})}
let forgeCurrentPage='home',forgeSwipeStart=null;
document.getElementById('main').addEventListener('touchstart',e=>{
 if(e.touches.length!==1||!['home','nutrition'].includes(forgeCurrentPage)||e.target.closest('input,textarea,select,button')){forgeSwipeStart=null;return}
 forgeSwipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY,time:Date.now()};
},{passive:true});
document.getElementById('main').addEventListener('touchend',e=>{
 if(!forgeSwipeStart||e.changedTouches.length!==1)return;
 let dx=e.changedTouches[0].clientX-forgeSwipeStart.x,dy=e.changedTouches[0].clientY-forgeSwipeStart.y;
 let start=forgeSwipeStart;forgeSwipeStart=null;
 if(Math.abs(dx)<85||Math.abs(dx)<Math.abs(dy)*1.5||Date.now()-start.time>900)return;
 if(forgeCurrentPage==='home'&&dx<0){show('nutrition');forgeAnimateSwipe('swipe-from-right')}
 else if(forgeCurrentPage==='nutrition'&&dx>0){show('home');forgeAnimateSwipe('swipe-from-left')}
},{passive:true});

show('home');
setTimeout(()=>checkForgeFitUpdate(false),1200);
</script></body></html>
