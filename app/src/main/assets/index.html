<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ForgeFit</title>
<style>
:root{--bg:#0b0d0f;--card:#15191d;--muted:#8d969f;--text:#f5f7f8;--accent:#b8ff4d;--line:#252b30;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{border:0}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:86px}.top{padding:22px 18px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:24px;letter-spacing:-.8px}.brand span{color:var(--accent)}.screen{padding:0 14px}.eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1.3px}.title{font-size:30px;font-weight:900;margin:4px 0 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.hero{padding:20px;background:linear-gradient(145deg,#182016,#121518)}.hero h2{margin:3px 0 7px;font-size:24px}.muted{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{background:#252b30;color:#fff;padding:12px 15px;border-radius:12px;font-weight:800}.primary{background:var(--accent);color:#081006}.small{padding:8px 10px;font-size:13px}.nav{position:fixed;bottom:0;left:0;right:0;background:#101316ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.nav button{background:none;color:var(--muted);padding:12px 18px 15px;min-width:82px;font-size:12px;font-weight:800}.nav button.active{color:var(--accent)}.nav b{display:block;font-size:18px;margin-bottom:2px}.exercise{border:1px solid var(--line);border-radius:15px;padding:13px;margin:10px 0;background:#111519}.exercise h3{margin:0;font-size:17px}.exercise.active-ex{border-color:var(--accent)}.exercise-timer{font-size:30px;font-weight:900;letter-spacing:.5px}.timerline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.tag{font-size:11px;color:var(--accent);font-weight:800}.sets{margin-top:10px}.set{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:7px;align-items:center;margin:6px 0}.set input,.set select{width:100%;background:#0b0e10;border:1px solid #2a3035;color:#fff;border-radius:9px;padding:9px;min-height:42px}.set select{appearance:auto}.set .num{color:var(--muted);font-size:12px;text-align:center}.check{width:44px;height:38px;border-radius:9px;background:#252b30;color:#aaa}.check.done{background:var(--accent);color:#071000}.bar{height:8px;background:#292f34;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#101417;border:1px solid var(--line);padding:13px;border-radius:13px}.stat strong{font-size:21px;display:block}.list{display:flex;flex-direction:column;gap:8px}.item{padding:14px;border:1px solid var(--line);border-radius:13px;background:#111519}.hidden{display:none}.timer{font-size:44px;font-weight:900;text-align:center;margin:8px}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:var(--muted);font-size:12px}.danger{color:var(--danger)}
.day-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 18px}.day-picker .btn{padding:14px 4px;font-size:13px;min-height:52px}@media(max-width:380px){.day-picker .btn{font-size:12px}} </style></head><body><div class="app"><header class="top"><div class="brand">FORGE<span>FIT</span></div><button class="btn small" onclick="show('more')">⚙</button></header><button id="update-banner" class="btn primary hidden" style="margin:0 14px 12px;width:calc(100% - 28px)" onclick="openForgeFitUpdate()"></button><main id="main" class="screen"></main><nav class="nav"><button id="n-train" onclick="show('train')"><b>▶</b>TRAIN</button><button id="n-plan" onclick="show('plan')"><b>☷</b>PLAN</button><button id="n-progress" onclick="show('progress')"><b>↗</b>PROGRESS</button><button id="n-more" onclick="show('more')"><b>•••</b>MORE</button></nav></div>
<script>
const defaultPlan=[
{name:'Chest Day',focus:'Chest • Shoulders • Triceps',ex:[['Barbell Bench Press','Chest',3,6,10,120],['Incline Bench Press','Chest',3,8,12,90],['Shoulder Press','Shoulders',3,8,12,90],['Cable / Pec Deck Fly','Chest',3,10,15,60],['Lateral Raise','Shoulders',3,12,15,60],['Triceps Pressdown','Triceps',3,10,15,60]]},
{name:'Back Day',focus:'Back • Biceps • Traps',ex:[['Barbell Bent-Over Row','Back',3,6,10,120],['Lat Pulldown','Back',3,8,12,90],['Seated Cable Row','Back',3,8,12,90],['Dumbbell Curl','Biceps',3,10,15,60],['Hammer Curl','Biceps',3,10,15,60],['Shrugs','Traps',3,10,15,75]]},
{name:'Leg Day',focus:'Quads • Hamstrings • Glutes • Calves',ex:[['Squat','Quads / Glutes',3,6,10,150],['Leg Press','Quads / Glutes',3,8,12,120],['Romanian Deadlift','Hamstrings / Glutes',3,8,12,120],['Leg Extension','Quads',3,10,15,75],['Leg Curl','Hamstrings',3,10,15,75],['Calf Raise','Calves',3,10,15,60]]}
];
let state=JSON.parse(localStorage.getItem('forgefit')||'null')||{plan:defaultPlan,history:[],current:null,week:1};
function save(){localStorage.setItem('forgefit',JSON.stringify(state))}
function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;')}
function lastFor(name){for(let i=state.history.length-1;i>=0;i--){let e=state.history[i].exercises.find(x=>x.name===name&&(x.sets||[]).some(s=>s.done));if(e)return e}return null}
function previousCompletedSets(name){let last=lastFor(name);return last?(last.sets||[]).filter(s=>s.done):[]}
function recommend(e){let previous=previousCompletedSets(e[0]);let base=previous[0];return {w:base?.weight??e[5]??0,r:base?.reps??e[3],why:base?'Last completed workout':'First workout'}}
function show(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('n-'+page)?.classList.add('active');let m=document.getElementById('main');if(page==='train')renderTrain(m);if(page==='plan')renderPlan(m);if(page==='progress')renderProgress(m);if(page==='more')renderMore(m)}
function chooseDay(idx){if(!Number.isInteger(idx)||idx<0||idx>=state.plan.length)return;if(state.current?.day!==idx){if(state.current&&Object.values(state.current.sets).some(a=>Array.isArray(a)&&a.some(x=>x.done))){forgeDialog('Switch Workout Day?','Your unfinished sets will be cleared.',()=>{state.current={day:idx,sets:{}};save();show('train')},'Switch Day',true);return}state.current={day:idx,sets:{}};save()}show('train')}
const planetFitnessSwaps={
'Chest':["Pectoral Fly (Butterfly) Machine","Machine Bench Press","Plate-Loaded Supine Bench Press",'Smith Machine Bench Press','Seated Chest Press Machine','Plate-Loaded Supine Chest Press','Incline Chest Press Machine','Smith Machine Incline Bench Press','Dumbbell Bench Press','Dumbbell Incline Press','Pec Deck Fly','Cable Chest Fly'],
'Shoulders':["Shoulder Press Machine","Lateral Raise Machine",'Seated Shoulder Press Machine','Smith Machine Shoulder Press','Dumbbell Shoulder Press','Cable Lateral Raise','Dumbbell Lateral Raise','Reverse Pec Deck'],
'Triceps':["Tricep Extension Machine",'Cable Triceps Pushdown','Rope Triceps Pushdown','Overhead Cable Triceps Extension','Assisted Dip Machine'],
'Back':["Lat Pulldown",'Lat Pulldown Machine','Close-Grip Lat Pulldown','Seated Cable Row','Seated Row Machine','Chest-Supported Row Machine','Smith Machine Bent-Over Row','One-Arm Dumbbell Row','Assisted Pull-Up Machine'],
'Biceps':["Bicep Curl Station","Fixed Barbell Bicep Curl",'Dumbbell Curl','Hammer Curl','Preacher Curl Machine','Cable Biceps Curl'],
'Traps':['Dumbbell Shrugs','Smith Machine Shrugs','Cable Shrugs'],
'Quads / Glutes':["Seated Leg Press","Hip Adduction Machine","Hip Abduction Machine",'Leg Press Machine','Hack Squat Machine','Smith Machine Squat','Goblet Squat','Leg Extension Machine','Dumbbell Lunges'],
'Quads':['Leg Extension Machine','Leg Press Machine','Hack Squat Machine','Smith Machine Squat'],
'Hamstrings / Glutes':['Seated Leg Curl Machine','Lying Leg Curl Machine','Smith Machine Romanian Deadlift','Dumbbell Romanian Deadlift'],
'Hamstrings':["Lying / Seated Leg Curl Machine",'Seated Leg Curl Machine','Lying Leg Curl Machine','Dumbbell Romanian Deadlift'],
'Abs':['Abdominal Crunch Machine'],
'Calves':['Calf Raise Machine','Leg Press Calf Raise','Smith Machine Calf Raise']
};
function forgeDialog(title,message,action,label='Confirm',danger=false){
 const old=document.getElementById('forge-dialog');if(old)old.remove();
 const modal=document.createElement('div');modal.id='forge-dialog';
 modal.style.cssText='position:fixed;inset:0;background:#000d;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px';
 modal.innerHTML='<div class="card" role="dialog" aria-modal="true" style="width:100%;max-width:420px;padding:24px"><div class="eyebrow">FORGEFIT</div><h3 id="dialog-title" style="font-size:23px;margin:12px 0"></h3><p id="dialog-text" class="muted" style="white-space:pre-line;line-height:1.5"></p><div class="row" style="justify-content:flex-end;margin-top:22px"><button class="btn" id="dialog-cancel">Cancel</button><button class="btn primary" id="dialog-ok"></button></div></div>';
 modal.querySelector('#dialog-title').textContent=title;modal.querySelector('#dialog-text').textContent=message;
 const ok=modal.querySelector('#dialog-ok');ok.textContent=label;
 if(danger){ok.style.background='#b93838';ok.style.color='white'}
 modal.querySelector('#dialog-cancel').onclick=()=>modal.remove();
 ok.onclick=()=>{modal.remove();if(action)action()};
 if(!action)modal.querySelector('#dialog-cancel').remove();
 document.body.appendChild(modal);ok.focus();
}
function workoutExercises(){return state.current?.customExercises||state.plan[state.current.day].ex}
function currentExercise(ei){let base=workoutExercises()[ei];let name=state.current.swaps?.[ei];return name?[name,...base.slice(1)]:base}
function swapExercise(ei){let original=workoutExercises()[ei],current=currentExercise(ei),category=original[1],options=[original[0],...(planetFitnessSwaps[category]||[])];options=[...new Set(options)];let rows=options.map((name,i)=>`<button class="btn ${name===current[0]?'primary':''}" style="text-align:left;width:100%;margin:4px 0" onclick="applyExerciseSwap(${ei},${i})">${esc(name)}${name===current[0]?' ✓':''}</button>`).join('');let modal=document.createElement('div');modal.id='swap-modal';modal.style.cssText='position:fixed;inset:0;background:#000c;z-index:30;display:flex;align-items:center;justify-content:center;padding:14px';modal.innerHTML=`<div class="card" style="width:100%;max-width:500px;max-height:82vh;overflow:auto"><div class="row"><div><div class="eyebrow">PLANET FITNESS • ALA MOANA</div><h3>Swap ${esc(original[0])}</h3></div><button class="btn" onclick="document.getElementById('swap-modal').remove()">✕</button></div><p class="muted">Choose a machine or exercise for today only. Exact equipment can vary at the gym.</p>${rows}</div>`;document.body.appendChild(modal);window.swapOptions=options}
function applyExerciseSwap(ei,choice){let name=window.swapOptions?.[choice];if(!name)return;let original=state.plan[state.current.day].ex[ei];if(state.current.sets[ei]?.some(x=>x.done)||state.current.exerciseTimers?.[ei]?.startedAt){forgeDialog('Switch Exercise?','This resets the current sets and timer.',()=>{delete state.current.sets[ei];if(state.current.exerciseTimers)delete state.current.exerciseTimers[ei];applyExerciseSwap(ei,choice)},'Switch Exercise',true);return}state.current.swaps??={};if(name===original[0])delete state.current.swaps[ei];else state.current.swaps[ei]=name;delete state.current.sets[ei];if(state.current.exerciseTimers)delete state.current.exerciseTimers[ei];save();document.getElementById('swap-modal')?.remove();renderTrain(document.getElementById('main'))}
function ensureWorkoutList(){state.current.customExercises??=state.plan[state.current.day].ex.map(e=>[...e]);return state.current.customExercises}
function addWorkoutExercise(){let all=[...new Set(Object.values(planetFitnessSwaps).flat())];let options=['Treadmill',...all];let modal=document.createElement('div');modal.id='add-modal';modal.style.cssText='position:fixed;inset:0;background:#000c;z-index:30;display:flex;align-items:center;justify-content:center;padding:14px';modal.innerHTML=`<div class="card" style="max-height:80vh;overflow:auto;width:100%;max-width:500px"><div class="row"><h3>Add exercise for today</h3><button class="btn" onclick="document.getElementById('add-modal').remove()">✕</button></div><p class="muted">Select a machine or treadmill. Your regular plan stays the same.</p><input type="search" placeholder="Search machines or exercises" oninput="document.querySelectorAll('.exercise-option').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(this.value.toLowerCase())?'block':'none')" style="width:100%;padding:12px;margin-bottom:12px;border-radius:10px;background:#0b0e10;color:white;border:1px solid #39424a">${options.map((n,i)=>`<button class="btn exercise-option" style="width:100%;text-align:left;margin:3px 0" onclick="addSelectedExercise(${i})">${esc(n)}</button>`).join('')}</div>`;window.addOptions=options;document.body.appendChild(modal)}
function addSelectedExercise(i){let name=window.addOptions?.[i];if(!name)return;let group=Object.keys(planetFitnessSwaps).find(k=>planetFitnessSwaps[k].includes(name))||'Chest';let ex=name==='Treadmill'?['Treadmill','Cardio',0,0,0,0]:[name,group,3,8,12,0];ensureWorkoutList().push(ex);save();document.getElementById('add-modal')?.remove();renderTrain(document.getElementById('main'))}
function removeWorkoutExercise(ei){forgeDialog('Remove Exercise?','Remove this exercise from today only? Your regular plan stays unchanged.',()=>removeWorkoutExerciseConfirmed(ei),'Remove Exercise',true)}
function removeWorkoutExerciseConfirmed(ei){ensureWorkoutList().splice(ei,1);let nextSets={},nextTimers={},nextCardio={},nextSwaps={};for(let [src,dst] of [[state.current.sets,nextSets],[state.current.exerciseTimers||{},nextTimers],[state.current.cardio||{},nextCardio],[state.current.swaps||{},nextSwaps]])for(let [key,val] of Object.entries(src)){let k=Number(key);if(k!==ei)dst[k>ei?k-1:k]=val}state.current.sets=nextSets;state.current.exerciseTimers=nextTimers;state.current.cardio=nextCardio;state.current.swaps=nextSwaps;save();renderTrain(document.getElementById('main'))}
function treadmillHtml(e,ei){let c=state.current.cardio?.[ei]||{};return `<section class="exercise" style="position:relative;padding-top:30px"><button onclick="removeWorkoutExercise(${ei})" aria-label="Remove treadmill" title="Remove from today" style="position:absolute;top:8px;right:8px;background:transparent;color:#aeb8c3;border:1px solid #45505b;border-radius:50%;width:29px;height:29px;font-size:20px;line-height:24px;cursor:pointer">×</button><div class="row"><h3>Treadmill</h3></div><p class="muted">Enter your treadmill results. Leave unused fields blank.</p>${[['minutes','Minutes'],['distance','Distance (miles)'],['speed','Speed (mph)'],['incline','Incline (%)'],['calories','Calories']].map(([k,label])=>`<div class="row" style="margin:9px 0"><label for="cardio-${ei}-${k}">${label}</label><input id="cardio-${ei}-${k}" type="number" min="0" step="any" value="${c[k]??''}" style="max-width:125px;background:#0b0e10;color:white;border:1px solid #333;border-radius:9px;padding:9px" onchange="updateCardio(${ei},'${k}',this.value)"></div>`).join('')}</section>`}
function updateCardio(ei,key,value){state.current.cardio??={};state.current.cardio[ei]??={};if(value==='')delete state.current.cardio[ei][key];else state.current.cardio[ei][key]=Math.max(0,Number(value)||0);save()}
function renderTrain(m){let idx=state.current?.day??(state.history.length%3);let day=state.plan[idx];if(!state.current)state.current={day:idx,sets:{}};let exercises=workoutExercises();let done=Object.values(state.current.sets).reduce((n,sets)=>n+(Array.isArray(sets)?sets.filter(x=>x.done).length:0),0);let total=exercises.reduce((a,e)=>a+e[2],0);m.innerHTML=`<div class="eyebrow">CHOOSE YOUR WORKOUT • WEEK ${state.week}</div><div class="day-picker">${state.plan.map((d,i)=>`<button class="btn ${idx===i?"primary":""}" onclick="chooseDay(${i})">${esc(d.name)}</button>`).join("")}</div><div class="eyebrow">SELECTED WORKOUT</div><div class="title">${day.name}</div><div class="card hero"><div class="row"><div><h2>${day.focus}</h2><div class="muted">${done}/${total} sets completed</div></div><span class="pill">RIR 1–2</span></div><div class="bar" style="margin-top:14px"><i style="width:${Math.round(done/total*100)}%"></i></div></div>${exercises.map((e,ei)=>exerciseHtml(currentExercise(ei),ei)).join('')}<button class="btn" style="width:100%;margin:8px 0" onclick="addWorkoutExercise()">+ ADD EXERCISE / TREADMILL</button><button class="btn primary" style="width:100%;margin:8px 0" onclick="finishWorkout()">FINISH WORKOUT</button>`;refreshSetRest();updateExerciseClocks()}
function weightOptions(selected){let vals=[];for(let w=0;w<=500;w+=5)vals.push(w);if(!vals.includes(Number(selected)))vals.push(Number(selected));vals.sort((a,b)=>a-b);return vals.map(w=>`<option value="${w}" ${Number(selected)===w?'selected':''}>${w} lb</option>`).join('')}
function repOptions(selected){let vals=[];for(let r=1;r<=30;r++)vals.push(r);if(!vals.includes(Number(selected)))vals.push(Number(selected));vals.sort((a,b)=>a-b);return vals.map(r=>`<option value="${r}" ${Number(selected)===r?'selected':''}>${r}</option>`).join('')}
function exerciseHtml(e,ei){if(e[1]==='Cardio')return treadmillHtml(e,ei);let r=recommend(e),previous=previousCompletedSets(e[0]);let sets=state.current?.sets?.[ei]||Array.from({length:e[2]},(_,si)=>{let prev=previous[si]||previous[previous.length-1];return {weight:prev?.weight??r.w,reps:prev?.reps??r.r,done:false}});state.current.sets[ei]=sets;return `<section class="exercise" id="exercise-${ei}" style="position:relative;padding-top:30px"><button onclick="removeWorkoutExercise(${ei})" aria-label="Remove exercise" title="Remove from today" style="position:absolute;top:8px;right:8px;background:transparent;color:#aeb8c3;border:1px solid #45505b;border-radius:50%;width:29px;height:29px;font-size:20px;line-height:24px;cursor:pointer">×</button><div class="row"><div><h3><button onclick="swapExercise(${ei})" style="background:none;color:inherit;font-size:inherit;font-weight:inherit;text-align:left;padding:0;text-decoration:underline;text-decoration-color:#009dff;text-underline-offset:5px">${esc(e[0])} ⇄</button></h3><div class="tag">${e[1]} • ${e[3]}–${e[4]} reps</div></div><span class="pill">${r.why}</span></div><div class="timerline"><div><div class="eyebrow" id="timer-label-${ei}">EXERCISE TIMER</div><div class="exercise-timer" id="exercise-timer-${ei}">0:00</div></div><button class="btn primary" id="exercise-btn-${ei}" onclick="toggleExerciseTimer(${ei})">START EXERCISE</button></div><div class="eyebrow" id="rest-label-${ei}" style="margin-top:8px">REST AFTER SET • ${fmt(restForExercise(ei))}</div><div class="exercise-timer" id="rest-timer-${ei}" style="font-size:24px">—</div><div class="sets">${sets.map((s,si)=>`<div class="set"><div class="num">${si+1}</div><select aria-label="Set ${si+1} weight" onchange="upd(${ei},${si},'weight',this.value)">${weightOptions(s.weight)}</select><select aria-label="Set ${si+1} reps" onchange="upd(${ei},${si},'reps',this.value)">${repOptions(s.reps)}</select><button class="check ${s.done?'done':''}" onclick="toggleSet(${ei},${si})">✓</button></div>`).join('')}</div></section>`}
function upd(ei,si,k,v){state.current.sets[ei][si][k]=Number(v);save()}
function toggleSet(ei,si){let set=state.current.sets[ei][si];set.done=!set.done;if(set.done)startExerciseClock(ei);let allDone=state.current.sets[ei].every(s=>s.done);if(allDone)stopExerciseClock(ei);else if(!set.done&&state.current.exerciseTimers?.[ei]?.finished)startExerciseClock(ei);save();renderTrain(document.getElementById('main'));if(set.done&&!allDone)startSetRest(ei);else if(allDone){clearInterval(restInterval);restInterval=null;restExercise=null}else refreshSetRest()}
function finishWorkout(){clearInterval(restInterval);restExercise=null;if(state.current?.exerciseTimers){Object.keys(state.current.exerciseTimers).forEach(k=>{let t=state.current.exerciseTimers[k];if(t.startedAt){t.elapsed+=(Date.now()-t.startedAt)/1000;t.startedAt=null}})}let idx=state.current.day,day=state.plan[idx];let previous=[...state.history].reverse().find(h=>h.day===day.name);let exercises=workoutExercises().map((e,ei)=>({name:currentExercise(ei)[0],sets:state.current.sets[ei]||[],...(e[1]==='Cardio'?{cardio:state.current.cardio?.[ei]||{}}:{})}));let changes=[];exercises.forEach(ex=>{let prev=previous?.exercises?.find(p=>p.name===ex.name);if(!prev)return;let nowMax=Math.max(0,...ex.sets.filter(s=>s.done).map(s=>Number(s.weight)||0));let prevMax=Math.max(0,...prev.sets.filter(s=>s.done).map(s=>Number(s.weight)||0));if(nowMax>prevMax)changes.push(`${ex.name}: ${prevMax} → ${nowMax} lb`)});let durationSeconds=Math.round(Object.values(state.current.exerciseTimers||{}).reduce((sum,t)=>sum+(Number(t.elapsed)||0),0)+Object.values(state.current.cardio||{}).reduce((sum,t)=>sum+(Number(t.minutes)||0)*60,0));state.history.push({date:new Date().toISOString(),day:day.name,exercises,durationSeconds});if(idx===2)state.week++;state.current=null;save();let durationText=durationLabel(durationSeconds);let msg=changes.length?`Workout complete! Total exercise time: ${durationText}.\n\nYou increased weight today:\n\n${changes.join('\n')}`:`Workout complete! Total exercise time: ${durationText}.\n\nYour workout is saved in history.`;forgeDialog('Workout Complete!',msg,null,'OK');show('progress')}
function renderPlan(m){m.innerHTML=`<div class="eyebrow">YOUR PROGRAM</div><div class="title">3-Day Chest / Back / Legs</div><div class="card"><div class="row"><div><b>Goal</b><div class="muted">Muscle + strength</div></div><span class="pill">8–12 weeks</span></div><p class="muted">I made the hard programming decisions for you. Your six exercises stay consistent so every workout is easy to compare. ForgeFit remembers your last performance and progresses reps or load over time.</p></div>${state.plan.map((d,i)=>`<div class="item" onclick="forgeDialog('${d.name}','${d.ex.length} exercises',null,'OK')"><div class="row"><b>${i+1}. ${d.name}</b><span class="pill">${d.ex.reduce((a,e)=>a+e[2],0)} sets</span></div><div class="muted" style="margin-top:5px">${d.focus}</div></div>`).join('')}<div class="card"><b>Progression rules</b><p class="muted">Hit the top of the rep range on every work set → add 5 lb next time. Otherwise add reps before load. If performance falls materially below the range, reduce load slightly.</p></div>`}
function durationLabel(seconds){let minutes=Math.floor((seconds||0)/60);let remaining=Math.round((seconds||0)%60);return minutes?`${minutes} minute${minutes===1?'':'s'}${remaining?' '+remaining+' sec':''}`:`${remaining} seconds`}
function renderProgress(m){let workouts=state.history.length;let total=state.history.reduce((a,h)=>a+h.exercises.reduce((x,e)=>x+(e.sets||[]).filter(s=>s.done).length,0),0);let volume=state.history.reduce((a,h)=>a+h.exercises.reduce((x,e)=>x+e.sets.reduce((y,s)=>y+s.weight*s.reps,0),0),0);let prs={};state.history.forEach(h=>h.exercises.forEach(e=>e.sets.forEach(s=>{if(!prs[e.name]||s.weight>prs[e.name])prs[e.name]=s.weight})));m.innerHTML=`<div class="eyebrow">TRAINING DATA</div><div class="title">Progress</div><div class="statgrid"><div class="stat"><strong>${workouts}</strong><span class="muted">Workouts</span></div><div class="stat"><strong>${total}</strong><span class="muted">Sets</span></div><div class="stat"><strong>${Math.round(volume).toLocaleString()}</strong><span class="muted">lb volume</span></div></div><div class="card"><b>Best loads</b><div class="list" style="margin-top:10px">${Object.entries(prs).slice(-8).reverse().map(([n,w])=>`<div class="row"><span>${esc(n)}</span><b>${w} lb</b></div>`).join('')||'<span class="muted">Complete your first workout to start tracking PRs.</span>'}</div></div><div class="card"><b>Workout history</b><div class="list" style="margin-top:10px">${state.history.slice().reverse().map(h=>`<div class="item"><div class="row"><b>${esc(h.day)}</b><span class="pill">${new Date(h.date).toLocaleDateString()}</span></div><div class="muted" style="margin-top:5px">${h.exercises.reduce((n,e)=>n+(e.sets||[]).filter(s=>s.done).length,0)} completed sets${h.exercises.filter(e=>e.cardio).map(e=>' • Treadmill '+(e.cardio.minutes||0)+' min'+(e.cardio.distance?' / '+e.cardio.distance+' mi':'')).join('')}${typeof h.durationSeconds==="number"?" • "+durationLabel(h.durationSeconds):""}</div></div>`).join('')||'<span class="muted">Your completed workouts will appear here.</span>'}</div></div><div class="card"><b>What ForgeFit is watching</b><p class="muted">Every completed workout is saved by date. New workouts begin with the same set weights and reps you used the last time you performed each exercise.</p></div>`}
let restEnd=0,restExercise=null,restInterval=null,exerciseTimerInt=null;
function exerciseClock(ei){state.current.exerciseTimers??={};return state.current.exerciseTimers[ei]??={elapsed:0,startedAt:null,finished:false}}
function elapsedSeconds(ei){let t=exerciseClock(ei);return Math.floor((t.elapsed||0)+(t.startedAt?(Date.now()-t.startedAt)/1000:0))}
function startExerciseClock(ei){let t=exerciseClock(ei);if(!t.startedAt){t.startedAt=Date.now();t.finished=false}save();updateExerciseClocks();if(!exerciseTimerInt)exerciseTimerInt=setInterval(updateExerciseClocks,1000)}
function stopExerciseClock(ei){let t=exerciseClock(ei);if(t.startedAt){t.elapsed+=(Date.now()-t.startedAt)/1000;t.startedAt=null}t.finished=true;save();updateExerciseClocks()}
function updateExerciseClocks(){if(!state.current)return;let exercises=workoutExercises();for(let ei=0;ei<exercises.length;ei++){let t=exerciseClock(ei),d=document.getElementById('exercise-timer-'+ei),l=document.getElementById('timer-label-'+ei),btn=document.getElementById('exercise-btn-'+ei);if(d)d.textContent=fmt(elapsedSeconds(ei));if(l)l.textContent=t.finished?'EXERCISE COMPLETE':t.startedAt?'EXERCISE RUNNING':'EXERCISE TIMER';if(btn){btn.textContent=t.finished?'COMPLETED':t.startedAt?'TIMER RUNNING':'START EXERCISE';btn.disabled=!!t.startedAt||!!t.finished;btn.classList.toggle('primary',!t.startedAt&&!t.finished)}}}
function toggleExerciseTimer(ei){startExerciseClock(ei)}
function refreshSetRest(){if(restExercise===null)return;let remaining=Math.max(0,Math.ceil((restEnd-Date.now())/1000));let d=document.getElementById('rest-timer-'+restExercise),l=document.getElementById('rest-label-'+restExercise);if(d)d.textContent=fmt(remaining);if(l)l.textContent=remaining?'REST AFTER SET • '+fmt(restForExercise(restExercise)):'REST COMPLETE';if(!remaining){clearInterval(restInterval);restInterval=null}}const exerciseRestSeconds={"Barbell Bench Press": 180, "Incline Bench Press": 150, "Machine Shoulder Press": 120, "Shoulder Press": 120, "Cable Fly": 90, "Pec Deck Fly": 90, "Cable Lateral Raise": 90, "Lateral Raise": 90, "Triceps Pressdown": 90, "Barbell Bent-Over Row": 180, "Bent-Over Barbell Row": 180, "Lat Pulldown": 120, "Seated Cable Row": 120, "Dumbbell Curl": 90, "Hammer Curl": 90, "Shrugs": 90, "Squat": 180, "Leg Press": 180, "Romanian Deadlift": 150, "Leg Extension": 90, "Leg Curl": 90, "Calf Raise": 90};function restForExercise(ei){let name=currentExercise(ei)[0];return exerciseRestSeconds[name]||90};function startSetRest(ei){clearInterval(restInterval);restExercise=ei;restEnd=Date.now()+restForExercise(ei)*1000;refreshSetRest();restInterval=setInterval(()=>{let before=Date.now()<restEnd;refreshSetRest();if(before&&Date.now()>=restEnd)navigator.vibrate?.([300,100,300])},250)}function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
const FORGEFIT_VERSION='4.13';
let availableUpdate=null,updateChecked=false;
function compareVersions(a,b){let aa=String(a).replace(/^v/i,'').split('.').map(Number),bb=String(b).replace(/^v/i,'').split('.').map(Number);for(let i=0;i<Math.max(aa.length,bb.length);i++){if((aa[i]||0)!==(bb[i]||0))return (aa[i]||0)-(bb[i]||0)}return 0}
async function checkForgeFitUpdate(manual=false){
  let status=document.getElementById('update-status');
  if(status)status.textContent='Checking GitHub for updates…';
  try{
    let response=await fetch('https://api.github.com/repos/chrisseavey/ForgeFit/releases/latest',{cache:'no-store'});
    if(!response.ok)throw Error('GitHub is unavailable');
    let release=await response.json();
    availableUpdate=compareVersions(release.tag_name,FORGEFIT_VERSION)>0?release:null;
    updateChecked=true;
    let banner=document.getElementById('update-banner');
    if(banner){banner.classList.toggle('hidden',!availableUpdate);if(availableUpdate)banner.textContent='ForgeFit '+release.tag_name+' is ready to install. Tap to update.'}
    if(status)status.textContent=availableUpdate?'New version available: '+release.tag_name:'You are up to date (V'+FORGEFIT_VERSION+').';
    if(manual&&!availableUpdate)forgeDialog('Up to Date','ForgeFit V'+FORGEFIT_VERSION+' is up to date.',null,'OK');
  }catch(err){if(status)status.textContent='Unable to check updates. Workouts still work offline.';if(manual)forgeDialog('Update Check Failed','Check your internet connection and try again.',null,'OK')}
}
function openForgeFitUpdate(){if(availableUpdate?.tag_name && window.ForgeFitUpdates?.downloadUpdate){forgeDialog('Install Update?','Download ForgeFit '+availableUpdate.tag_name+'? Your workout history will be kept.',()=>window.ForgeFitUpdates.downloadUpdate(availableUpdate.tag_name),'Download')}else if(window.ForgeFitUpdates?.openRelease)window.ForgeFitUpdates.openRelease();else window.location.href='https://github.com/chrisseavey/ForgeFit/releases/latest'}
function renderMore(m){m.innerHTML=`<div class="eyebrow">SETTINGS</div><div class="title">More</div><div class="card"><b>App updates • V${FORGEFIT_VERSION}</b><p class="muted" id="update-status">Check GitHub for a newer ForgeFit version.</p><button class="btn primary" onclick="checkForgeFitUpdate(true)">CHECK FOR UPDATES</button> <button class="btn" onclick="openForgeFitUpdate()">DOWNLOAD LATEST UPDATE</button></div><div class="card"><b>ForgeFit</b><p class="muted">Offline-first workouts. No account. Your workout history stays on this phone.</p><button class="btn" onclick="exportData()">EXPORT DATA</button></div><div class="card"><button class="btn danger" onclick="forgeDialog('Delete All Data?','This permanently removes your workout history and settings.',()=>{localStorage.removeItem('forgefit');location.reload()},'Delete All',true)">RESET ALL DATA</button></div>`}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='forgefit-data.json';a.click()}
show('train');
setTimeout(()=>checkForgeFitUpdate(false),1200);
</script></body></html>
