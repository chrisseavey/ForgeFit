<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ForgeFit</title>
<style>
:root{--bg:#0b0d0f;--card:#15191d;--muted:#8d969f;--text:#f5f7f8;--accent:#b8ff4d;--line:#252b30;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{border:0}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:86px}.top{padding:22px 18px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:24px;letter-spacing:-.8px}.brand span{color:var(--accent)}.screen{padding:0 14px}.eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1.3px}.title{font-size:30px;font-weight:900;margin:4px 0 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.hero{padding:20px;background:linear-gradient(145deg,#182016,#121518)}.hero h2{margin:3px 0 7px;font-size:24px}.muted{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{background:#252b30;color:#fff;padding:12px 15px;border-radius:12px;font-weight:800}.primary{background:var(--accent);color:#081006}.small{padding:8px 10px;font-size:13px}.nav{position:fixed;bottom:0;left:0;right:0;background:#101316ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.nav button{background:none;color:var(--muted);padding:12px 18px 15px;min-width:82px;font-size:12px;font-weight:800}.nav button.active{color:var(--accent)}.nav b{display:block;font-size:18px;margin-bottom:2px}.exercise{border:1px solid var(--line);border-radius:15px;padding:13px;margin:10px 0;background:#111519}.exercise h3{margin:0;font-size:17px}.exercise.active-ex{border-color:var(--accent)}.exercise-timer{font-size:30px;font-weight:900;letter-spacing:.5px}.timerline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.tag{font-size:11px;color:var(--accent);font-weight:800}.sets{margin-top:10px}.set{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:7px;align-items:center;margin:6px 0}.set input,.set select{width:100%;background:#0b0e10;border:1px solid #2a3035;color:#fff;border-radius:9px;padding:9px;min-height:42px}.set select{appearance:auto}.set .num{color:var(--muted);font-size:12px;text-align:center}.check{width:44px;height:38px;border-radius:9px;background:#252b30;color:#aaa}.check.done{background:var(--accent);color:#071000}.bar{height:8px;background:#292f34;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#101417;border:1px solid var(--line);padding:13px;border-radius:13px}.stat strong{font-size:21px;display:block}.list{display:flex;flex-direction:column;gap:8px}.item{padding:14px;border:1px solid var(--line);border-radius:13px;background:#111519}.hidden{display:none}.timer{font-size:44px;font-weight:900;text-align:center;margin:8px}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:var(--muted);font-size:12px}.danger{color:var(--danger)}
.day-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 18px}.day-picker .btn{padding:14px 4px;font-size:13px;min-height:52px}@media(max-width:380px){.day-picker .btn{font-size:12px}} </style></head><body><div class="app"><header class="top"><div class="brand">FORGE<span>FIT</span></div><button class="btn small" onclick="show('more')">⚙</button></header><main id="main" class="screen"></main><nav class="nav"><button id="n-train" onclick="show('train')"><b>▶</b>TRAIN</button><button id="n-plan" onclick="show('plan')"><b>☷</b>PLAN</button><button id="n-progress" onclick="show('progress')"><b>↗</b>PROGRESS</button><button id="n-more" onclick="show('more')"><b>•••</b>MORE</button></nav></div>
<script>
const defaultPlan=[
{name:'Chest Day',focus:'Chest • Shoulders • Triceps',ex:[['Barbell Bench Press','Chest',3,6,10,120],['Incline Bench Press','Chest',3,8,12,90],['Shoulder Press','Shoulders',3,8,12,90],['Cable / Pec Deck Fly','Chest',3,10,15,60],['Lateral Raise','Shoulders',3,12,15,60],['Triceps Pressdown','Triceps',3,10,15,60]]},
{name:'Back Day',focus:'Back • Biceps • Traps',ex:[['Barbell Bent-Over Row','Back',3,6,10,120],['Lat Pulldown','Back',3,8,12,90],['Seated Cable Row','Back',3,8,12,90],['Dumbbell Curl','Biceps',3,10,15,60],['Hammer Curl','Biceps',3,10,15,60],['Shrugs','Traps',3,10,15,75]]},
{name:'Leg Day',focus:'Quads • Hamstrings • Glutes • Calves',ex:[['Squat','Quads / Glutes',3,6,10,150],['Leg Press','Quads / Glutes',3,8,12,120],['Romanian Deadlift','Hamstrings / Glutes',3,8,12,120],['Leg Extension','Quads',3,10,15,75],['Leg Curl','Hamstrings',3,10,15,75],['Calf Raise','Calves',3,10,15,60]]}
];
let state=JSON.parse(localStorage.getItem('forgefit')||'null')||{plan:defaultPlan,history:[],current:null,week:1};
function save(){localStorage.setItem('forgefit',JSON.stringify(state))}
function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;')}
function lastFor(name){for(let i=state.history.length-1;i>=0;i--){let e=state.history[i].exercises.find(x=>x.name===name);if(e)return e}return null}
function recommend(e){let last=lastFor(e[0]);if(!last)return {w:e[5]||0,r:e[3],why:'First workout'};let completed=last.sets.filter(s=>s.done);let base=completed[0]||last.sets[0];return {w:base?.weight??e[5]??0,r:base?.reps??e[3],why:'Same weight as last time'}}
function show(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('n-'+page)?.classList.add('active');let m=document.getElementById('main');if(page==='train')renderTrain(m);if(page==='plan')renderPlan(m);if(page==='progress')renderProgress(m);if(page==='more')renderMore(m)}
function chooseDay(idx){if(!Number.isInteger(idx)||idx<0||idx>=state.plan.length)return;if(state.current?.day!==idx){if(state.current&&Object.values(state.current.sets).some(a=>Array.isArray(a)&&a.some(x=>x.done))&&!confirm('Switch workout days? Your unfinished sets on this day will be cleared.'))return;state.current={day:idx,sets:{}};save()}show('train')}
function renderTrain(m){let idx=state.current?.day??(state.history.length%3);let day=state.plan[idx];if(!state.current)state.current={day:idx,sets:{}};let done=Object.values(state.current.sets).filter(Boolean).length;let total=day.ex.reduce((a,e)=>a+e[2],0);m.innerHTML=`<div class="eyebrow">CHOOSE YOUR WORKOUT • WEEK ${state.week}</div><div class="day-picker">${state.plan.map((d,i)=>`<button class="btn ${idx===i?"primary":""}" onclick="chooseDay(${i})">${esc(d.name)}</button>`).join("")}</div><div class="eyebrow">SELECTED WORKOUT</div><div class="title">${day.name}</div><div class="card hero"><div class="row"><div><h2>${day.focus}</h2><div class="muted">${done}/${total} sets completed</div></div><span class="pill">RIR 1–2</span></div><div class="bar" style="margin-top:14px"><i style="width:${Math.round(done/total*100)}%"></i></div></div>${day.ex.map((e,ei)=>exerciseHtml(e,ei)).join('')}<button class="btn primary" style="width:100%;margin:8px 0" onclick="finishWorkout()">FINISH WORKOUT</button>`;refreshSetRest();updateExerciseClocks()}
function weightOptions(selected){let vals=[];for(let w=0;w<=500;w+=5)vals.push(w);if(!vals.includes(Number(selected)))vals.push(Number(selected));vals.sort((a,b)=>a-b);return vals.map(w=>`<option value="${w}" ${Number(selected)===w?'selected':''}>${w} lb</option>`).join('')}
function repOptions(selected){let vals=[];for(let r=1;r<=30;r++)vals.push(r);if(!vals.includes(Number(selected)))vals.push(Number(selected));vals.sort((a,b)=>a-b);return vals.map(r=>`<option value="${r}" ${Number(selected)===r?'selected':''}>${r}</option>`).join('')}
function exerciseHtml(e,ei){let r=recommend(e),last=lastFor(e[0]);let sets=state.current?.sets?.[ei]||Array.from({length:e[2]},(_,si)=>{let prev=last?.sets?.[si];return {weight:prev?.weight??r.w,reps:prev?.reps??r.r,done:false}});state.current.sets[ei]=sets;return `<section class="exercise" id="exercise-${ei}"><div class="row"><div><h3>${esc(e[0])}</h3><div class="tag">${e[1]} • ${e[3]}–${e[4]} reps</div></div><span class="pill">${r.why}</span></div><div class="timerline"><div><div class="eyebrow" id="timer-label-${ei}">EXERCISE TIMER</div><div class="exercise-timer" id="exercise-timer-${ei}">0:00</div></div><button class="btn primary" id="exercise-btn-${ei}" onclick="toggleExerciseTimer(${ei})">START EXERCISE</button></div><div class="eyebrow" id="rest-label-${ei}" style="margin-top:8px">REST AFTER SET • ${fmt(restForExercise(ei))}</div><div class="exercise-timer" id="rest-timer-${ei}" style="font-size:24px">—</div><div class="sets">${sets.map((s,si)=>`<div class="set"><div class="num">${si+1}</div><select aria-label="Set ${si+1} weight" onchange="upd(${ei},${si},'weight',this.value)">${weightOptions(s.weight)}</select><select aria-label="Set ${si+1} reps" onchange="upd(${ei},${si},'reps',this.value)">${repOptions(s.reps)}</select><button class="check ${s.done?'done':''}" onclick="toggleSet(${ei},${si})">✓</button></div>`).join('')}</div></section>`}
function upd(ei,si,k,v){state.current.sets[ei][si][k]=Number(v);save()}
function toggleSet(ei,si){let set=state.current.sets[ei][si];set.done=!set.done;if(set.done)startExerciseClock(ei);let allDone=state.current.sets[ei].every(s=>s.done);if(allDone)stopExerciseClock(ei);else if(!set.done&&state.current.exerciseTimers?.[ei]?.finished)startExerciseClock(ei);save();renderTrain(document.getElementById('main'));if(set.done&&!allDone)startSetRest(ei);else if(allDone){clearInterval(restInterval);restInterval=null;restExercise=null}else refreshSetRest()}
function finishWorkout(){clearInterval(restInterval);restExercise=null;if(state.current?.exerciseTimers){Object.keys(state.current.exerciseTimers).forEach(k=>{let t=state.current.exerciseTimers[k];if(t.startedAt){t.elapsed+=(Date.now()-t.startedAt)/1000;t.startedAt=null}})}let idx=state.current.day,day=state.plan[idx];let previous=[...state.history].reverse().find(h=>h.day===day.name);let exercises=day.ex.map((e,ei)=>({name:e[0],sets:state.current.sets[ei]}));let changes=[];exercises.forEach(ex=>{let prev=previous?.exercises?.find(p=>p.name===ex.name);if(!prev)return;let nowMax=Math.max(0,...ex.sets.filter(s=>s.done).map(s=>Number(s.weight)||0));let prevMax=Math.max(0,...prev.sets.filter(s=>s.done).map(s=>Number(s.weight)||0));if(nowMax>prevMax)changes.push(`${ex.name}: ${prevMax} → ${nowMax} lb`)});state.history.push({date:new Date().toISOString(),day:day.name,exercises});if(idx===2)state.week++;state.current=null;save();let msg=changes.length?`Workout saved! You increased weight today:\n\n${changes.join('\n')}`:'Workout saved. No weight increases today — your full workout is in history.';alert(msg);show('progress')}
function renderPlan(m){m.innerHTML=`<div class="eyebrow">YOUR PROGRAM</div><div class="title">3-Day Chest / Back / Legs</div><div class="card"><div class="row"><div><b>Goal</b><div class="muted">Muscle + strength</div></div><span class="pill">8–12 weeks</span></div><p class="muted">I made the hard programming decisions for you. Your six exercises stay consistent so every workout is easy to compare. ForgeFit remembers your last performance and progresses reps or load over time.</p></div>${state.plan.map((d,i)=>`<div class="item" onclick="alert('${d.name}: ${d.ex.length} exercises')"><div class="row"><b>${i+1}. ${d.name}</b><span class="pill">${d.ex.reduce((a,e)=>a+e[2],0)} sets</span></div><div class="muted" style="margin-top:5px">${d.focus}</div></div>`).join('')}<div class="card"><b>Progression rules</b><p class="muted">Hit the top of the rep range on every work set → add 5 lb next time. Otherwise add reps before load. If performance falls materially below the range, reduce load slightly.</p></div>`}
function renderProgress(m){let workouts=state.history.length;let total=state.history.reduce((a,h)=>a+h.exercises.reduce((x,e)=>x+e.sets.filter(s=>s.done).length,0),0);let volume=state.history.reduce((a,h)=>a+h.exercises.reduce((x,e)=>x+e.sets.reduce((y,s)=>y+s.weight*s.reps,0),0),0);let prs={};state.history.forEach(h=>h.exercises.forEach(e=>e.sets.forEach(s=>{if(!prs[e.name]||s.weight>prs[e.name])prs[e.name]=s.weight})));m.innerHTML=`<div class="eyebrow">TRAINING DATA</div><div class="title">Progress</div><div class="statgrid"><div class="stat"><strong>${workouts}</strong><span class="muted">Workouts</span></div><div class="stat"><strong>${total}</strong><span class="muted">Sets</span></div><div class="stat"><strong>${Math.round(volume).toLocaleString()}</strong><span class="muted">lb volume</span></div></div><div class="card"><b>Best loads</b><div class="list" style="margin-top:10px">${Object.entries(prs).slice(-8).reverse().map(([n,w])=>`<div class="row"><span>${esc(n)}</span><b>${w} lb</b></div>`).join('')||'<span class="muted">Complete your first workout to start tracking PRs.</span>'}</div></div><div class="card"><b>Workout history</b><div class="list" style="margin-top:10px">${state.history.slice().reverse().map(h=>`<div class="item"><div class="row"><b>${esc(h.day)}</b><span class="pill">${new Date(h.date).toLocaleDateString()}</span></div><div class="muted" style="margin-top:5px">${h.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0)} completed sets</div></div>`).join('')||'<span class="muted">Your completed workouts will appear here.</span>'}</div></div><div class="card"><b>What ForgeFit is watching</b><p class="muted">Every completed workout is saved by date. New workouts begin with the same set weights and reps you used the last time you performed each exercise.</p></div>`}
let restEnd=0,restExercise=null,restInterval=null,exerciseTimerInt=null;
function exerciseClock(ei){state.current.exerciseTimers??={};return state.current.exerciseTimers[ei]??={elapsed:0,startedAt:null,finished:false}}
function elapsedSeconds(ei){let t=exerciseClock(ei);return Math.floor((t.elapsed||0)+(t.startedAt?(Date.now()-t.startedAt)/1000:0))}
function startExerciseClock(ei){let t=exerciseClock(ei);if(!t.startedAt){t.startedAt=Date.now();t.finished=false}save();updateExerciseClocks();if(!exerciseTimerInt)exerciseTimerInt=setInterval(updateExerciseClocks,1000)}
function stopExerciseClock(ei){let t=exerciseClock(ei);if(t.startedAt){t.elapsed+=(Date.now()-t.startedAt)/1000;t.startedAt=null}t.finished=true;save();updateExerciseClocks()}
function updateExerciseClocks(){if(!state.current)return;let day=state.plan[state.current.day];for(let ei=0;ei<day.ex.length;ei++){let t=exerciseClock(ei),d=document.getElementById('exercise-timer-'+ei),l=document.getElementById('timer-label-'+ei),btn=document.getElementById('exercise-btn-'+ei);if(d)d.textContent=fmt(elapsedSeconds(ei));if(l)l.textContent=t.finished?'EXERCISE COMPLETE':t.startedAt?'EXERCISE RUNNING':'EXERCISE TIMER';if(btn){btn.textContent=t.finished?'COMPLETED':t.startedAt?'TIMER RUNNING':'START EXERCISE';btn.disabled=!!t.startedAt||!!t.finished;btn.classList.toggle('primary',!t.startedAt&&!t.finished)}}}
function toggleExerciseTimer(ei){startExerciseClock(ei)}
function refreshSetRest(){if(restExercise===null)return;let remaining=Math.max(0,Math.ceil((restEnd-Date.now())/1000));let d=document.getElementById('rest-timer-'+restExercise),l=document.getElementById('rest-label-'+restExercise);if(d)d.textContent=fmt(remaining);if(l)l.textContent=remaining?'REST AFTER SET • '+fmt(restForExercise(restExercise)):'REST COMPLETE';if(!remaining){clearInterval(restInterval);restInterval=null}}const exerciseRestSeconds={"Barbell Bench Press": 180, "Incline Bench Press": 150, "Machine Shoulder Press": 120, "Shoulder Press": 120, "Cable Fly": 90, "Pec Deck Fly": 90, "Cable Lateral Raise": 90, "Lateral Raise": 90, "Triceps Pressdown": 90, "Barbell Bent-Over Row": 180, "Bent-Over Barbell Row": 180, "Lat Pulldown": 120, "Seated Cable Row": 120, "Dumbbell Curl": 90, "Hammer Curl": 90, "Shrugs": 90, "Squat": 180, "Leg Press": 180, "Romanian Deadlift": 150, "Leg Extension": 90, "Leg Curl": 90, "Calf Raise": 90};function restForExercise(ei){let name=state.plan[state.current.day].ex[ei][0];return exerciseRestSeconds[name]||90};function startSetRest(ei){clearInterval(restInterval);restExercise=ei;restEnd=Date.now()+restForExercise(ei)*1000;refreshSetRest();restInterval=setInterval(()=>{let before=Date.now()<restEnd;refreshSetRest();if(before&&Date.now()>=restEnd)navigator.vibrate?.([300,100,300])},250)}function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function renderMore(m){m.innerHTML=`<div class="eyebrow">SETTINGS</div><div class="title">More</div><div class="card"><b>ForgeFit prototype</b><p class="muted">Offline-first. No account. Your data stays in this browser/device.</p><button class="btn" onclick="exportData()">EXPORT DATA</button></div><div class="card"><b>Design choices</b><p class="muted">Built around the best parts of Alpha Progression: stable programming, performance-based progression, RIR, workout logging, rest timer and visible progress. Alpha Progression itself has a much larger exercise library and deeper analytics.</p></div><div class="card"><button class="btn danger" onclick="if(confirm('Delete all ForgeFit data?')){localStorage.removeItem('forgefit');location.reload()}">RESET ALL DATA</button></div>`}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='forgefit-data.json';a.click()}
show('train');
</script></body></html>
